# =====================================================================
# race_abot_411_route_a.yaml —— A 路线任务队列 + 标志→动作映射 + 类别归一化
#
# ⚠ 重要：任务顺序按《附件3》第 3 页的文字描述 + 《标识.pdf》的标志清单整理。
#          文字描述里没有给出"左转×3 / 翻转"的插点位置，**必须在真实赛道上核对一次**。
#          核对方式：直接改下面 tasks 的顺序即可，代码不用动。
#
# trigger 说明：
#   sign —— 检测到指定标志才执行（sign 字段写标志名）
#   auto —— 几何任务（直角弯 / S弯 / 车库搬运），由前一个任务结束后自动执行
#   light—— 红绿灯（绿灯起步 / 红灯停车）
# =====================================================================

route_name: "A"

tasks:

  # ---- 1. 绿灯启动（5 分）----
  - id: 1
    name: "绿灯启动"
    trigger: light
    sign: "green_light"
    action: "start"
    score: 5
    note: "红灯必须停车等待；绿灯才起步。原代码把绿灯和右转绑在一起判，这里已拆开"

  # ---- 2. 转向标识（5 分）----
  # A 路线标志单上有 3 个"左转" + 1 个"右转"，按赛道实际顺序排
  - id: 2
    name: "转向标识-1"
    trigger: sign
    sign: "turn_right"
    action: "turn_right"
    score: 5
    note: "规则原文：识别右转向标识并完成相应转向"
  - id: 2.1
    name: "转向标识-2"
    trigger: sign
    sign: "turn_left"
    action: "turn_left"
    score: 0
    note: "★待现场核对：以下 3 个左转的位置。同属'转向标识'评分项，不重复计分"
  - id: 2.2
    name: "转向标识-3"
    trigger: sign
    sign: "turn_left"
    action: "turn_left"
    score: 0
  - id: 2.3
    name: "转向标识-4"
    trigger: sign
    sign: "turn_left"
    action: "turn_left"
    score: 0

  # ---- 3. 单边桥（5 分）----
  - id: 3
    name: "单边桥-1"
    trigger: sign
    sign: "single_bridge"
    action: "cross_bridge"
    score: 5
    note: "标志图：'通过单边桥 UNILATERAL BRIDGE'"

  # ---- 4. 直角弯（5 分）----
  - id: 4
    name: "直角弯-1"
    trigger: auto
    action: "lane_only"
    score: 5
    note: "无专用标志，靠巡线通过（如需可改为 sign + flip）"

  # ---- 5. 避障区（15 分）----
  - id: 5
    name: "避障区"
    trigger: sign
    sign: "obstacle"
    action: "obstacle_avoid"
    score: 15
    note: "标志图：黄色跑车照片。用 /sonar 触发绕障，务必不碰障碍物"

  # ---- 6. 直角弯（5 分）----
  - id: 6
    name: "直角弯-2"
    trigger: auto
    action: "lane_only"
    score: 5

  # ---- 7. 侧方停车（20 分）----
  - id: 7
    name: "侧方停车"
    trigger: sign
    sign: "parallel_parking"
    action: "parallel_parking"
    score: 20
    note: "标志图：蓝底白 P"

  # ---- 8. 倒入车库 A（20 分）----
  - id: 8
    name: "倒入车库A"
    trigger: sign
    sign: "reverse_parking"
    action: "reverse_parking"
    score: 20
    note: "标志图：黄三角'车入库'"

  # ---- 9. 车库 A → B（20 分）----
  - id: 9
    name: "车库A到B"
    trigger: auto
    action: "garage_transfer"
    score: 20
    note: "无专用标志，A→B 搬运靠固定动作串 / 定位（见 params.garage_transfer.mode）"

  # ---- 10. 定点停车（5 分）----
  - id: 10
    name: "定点停车"
    trigger: sign
    sign: "stop"
    action: "stop_wait"
    score: 5
    note: "标志图：红底八角'停'（停留）"

  # ---- 11. S 弯正进（5 分）----
  - id: 11
    name: "S弯正进到末端"
    trigger: auto
    action: "s_curve_in"
    score: 5
    note: "巡线到 S 弯末端；末端判定见 params.actions.s_curve_in.end_trigger"

  # ---- 12. 反向倒出 S 弯（5 分）----
  - id: 12
    name: "反向倒出S弯"
    trigger: sign
    sign: "reverse"
    action: "s_curve_out"
    score: 5
    note: "标志图：黄三角施工/倒车。倒车巡线出弯"

  # ---- 13. 单边桥（5 分）----
  - id: 13
    name: "单边桥-2"
    trigger: sign
    sign: "single_bridge"
    action: "cross_bridge"
    score: 5

  # ---- 14. 终点 ----
  - id: 14
    name: "终点"
    trigger: sign
    sign: "finish"
    action: "finish"
    score: 10
    note: "标志图：FINISH 横幅"

# =====================================================================
# 标志 → 动作 映射（A/B 通用；《标识.pdf》共 10 种标志 + 红绿灯）
# 左列为 YOLO 检测出的类别名（归一化后的规范名）
# =====================================================================
sign_action:
  green_light:      "start"              # 绿灯：起步
  red_light:        "stop_wait"          # 红灯：停车等待
  turn_left:        "turn_left"          # 左转标：90°左转
  turn_right:       "turn_right"         # 右转标：90°右转
  stop:             "stop_wait"          # 停留(红STOP)：停车等待
  obstacle:         "obstacle_avoid"     # 障碍物(黄跑车)：避障绕行
  reverse:          "s_curve_out"        # 倒车(黄三角)：倒车巡线
  flip:             "flip"               # 翻转(循环箭头)：180°掉头
  finish:           "finish"             # 终点(FINISH)：结束
  parallel_parking: "parallel_parking"   # 侧方位停车(蓝P)：侧方停车
  single_bridge:    "cross_bridge"       # 单边桥：居中过桥
  reverse_parking:  "reverse_parking"    # 倒车入库(黄三角车库)：倒车入库

# =====================================================================
# 类别名归一化：不同 .pt 训练出来的名字不一样，进检测回调先映射成规范名，
# 这样代码里只认规范名，换模型不用改代码。
# 键 = 规范名，值 = 别名列表
# =====================================================================
class_alias:
  green_light:      ["greenlight", "green", "traffic_light_green", "green_light_on"]
  red_light:        ["red", "redlight", "traffic_light_red"]
  turn_left:        ["turnleft", "left_turn", "left"]
  turn_right:       ["turnright", "right_turn", "right"]
  stop:             ["tingliu", "stop_sign", "halt"]
  obstacle:         ["obstacle_car", "barrier", "car"]          # car.pt / mmbest.pt 里的 "car"
  reverse:          ["daoche", "back", "reverse_lane"]
  flip:             ["turn", "fanzhuan", "u_turn"]              # 原 best.pt 里的 "turn" 即翻转
  finish:           ["final", "zhongdian", "end"]
  parallel_parking: ["cefang", "Parallel_parking", "parking_p"]
  single_bridge:    ["danbian", "bridge", "unilateral_bridge"]
  reverse_parking:  ["ruku", "park_reverse", "in_garage"]

# =====================================================================
# 当前 4 个模型（best/car/aaabest/mmbest）的类别覆盖情况
#   have: true  已有；false 需要补标注重训
# =====================================================================
class_coverage:
  green_light:      {have: true,  models: ["best.pt", "aaabest.pt"]}
  red_light:        {have: false, models: [], note: "只有 aaabest.pt 有 red/yellow，建议换 aaabest.pt"}
  turn_left:        {have: true,  models: ["best.pt", "car.pt", "aaabest.pt", "mmbest.pt"]}
  turn_right:       {have: true,  models: ["best.pt", "car.pt", "aaabest.pt", "mmbest.pt"]}
  stop:             {have: true,  models: ["best.pt", "car.pt", "aaabest.pt", "mmbest.pt"]}
  obstacle:         {have: false, models: [], note: "★15分项，必须补标注（黄色跑车）"}
  reverse:          {have: true,  models: ["best.pt", "car.pt", "aaabest.pt", "mmbest.pt"], note: "对应 daoche"}
  flip:             {have: true,  models: ["best.pt", "aaabest.pt"], note: "对应 turn"}
  finish:           {have: true,  models: ["best.pt", "car.pt", "aaabest.pt", "mmbest.pt"], note: "对应 final"}
  parallel_parking: {have: true,  models: ["best.pt", "aaabest.pt"], note: "对应 cefang"}
  single_bridge:    {have: false, models: [], note: "★10分项，必须补标注（通过单边桥）"}
  reverse_parking:  {have: true,  models: ["best.pt", "aaabest.pt"], note: "对应 ruku"}
